<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بلوت أونلاين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100dvh;font-family:Cairo,Tahoma,sans-serif;color:#fff;background:radial-gradient(circle at 50% 40%,#1d7a54,#0a3526 70%);overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;padding-top:calc(18px + env(safe-area-inset-top))}
.scr.on{display:flex}
h1{font-size:3.4rem;margin:0;color:#e6b84c;text-shadow:0 4px 18px #0008}
h2{margin:0;color:#e6b84c}
input{font:inherit;padding:12px 16px;border-radius:12px;border:2px solid #e6b84c66;background:#0006;color:#fff;text-align:center;font-size:1.2rem;width:min(280px,80vw)}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:12px 22px;font-size:1.05rem;background:linear-gradient(#f3cf6e,#c99a2e);color:#3a2a00;box-shadow:0 4px 0 #8a6a14}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a14}
button.g{background:#ffffff22;color:#fff;box-shadow:none}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avs span{font-size:1.8rem;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:#0005;cursor:pointer;border:3px solid transparent}
.avs span.sel{border-color:#e6b84c;box-shadow:0 0 14px #e6b84c}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{background:#0006;border:1px solid #e6b84c44;border-radius:16px;padding:14px 22px;text-align:center}
.card b{font-size:1.6rem;display:block;color:#e6b84c}
.code{font-size:3.4rem;letter-spacing:8px;color:#e6b84c;font-weight:800}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(340px,90vw)}
.seat{background:#0006;border-radius:14px;padding:12px;text-align:center;min-height:84px}
.seat .e{font-size:2rem}.seat.empty{opacity:.4}
.c{width:clamp(46px,11.5vw,64px);aspect-ratio:5/7;background:#fff;color:#111;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;line-height:1;box-shadow:0 3px 8px #0008;flex:none;animation:pop .25s}
.c i{font-style:normal;font-size:1.5em}.c.r{color:#c0272d}
.c.bk{background:repeating-linear-gradient(45deg,#8b1d2c,#8b1d2c 5px,#a82a3b 5px,#a82a3b 10px);border:3px solid #fff}
.c.mini{width:30px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#tb{position:absolute;inset:0}
.top{position:absolute;top:0;inset-inline:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;background:#0006;font-weight:800}
.top b{color:#e6b84c;font-size:1.3rem}
.pl{position:absolute;text-align:center;font-size:.8rem}
.p1{right:8px;top:40%}.p3{left:8px;top:40%}.p2{top:calc(62px + env(safe-area-inset-top));left:50%;transform:translateX(-50%)}
.av{font-size:1.8rem;background:#0007;border-radius:50%;width:52px;height:52px;display:grid;place-items:center;margin:0 auto 2px;border:3px solid transparent}
.act .av{border-color:#e6b84c;box-shadow:0 0 18px #e6b84c}
.pl .c{margin:2px auto 0}.pl em{font-style:normal;font-weight:800}
.mid{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:210px;height:190px}
.sl{position:absolute}
.s0{bottom:0;left:50%;transform:translateX(-50%)}.s2{top:0;left:50%;transform:translateX(-50%)}
.s1{right:0;top:50%;transform:translateY(-50%)}.s3{left:0;top:50%;transform:translateY(-50%)}
.hand{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));inset-inline:0;display:flex;justify-content:center}
.hand .c{margin-inline:-6px;transition:.15s}
.hand .c.ok{transform:translateY(-16px);cursor:pointer;box-shadow:0 0 0 3px #e6b84c,0 3px 8px #0008}
.hand .c.no{filter:brightness(.55)}
.bid{position:absolute;bottom:calc(125px + env(safe-area-inset-bottom));inset-inline:0;display:flex;gap:10px;justify-content:center}
.me{position:absolute;bottom:calc(112px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-weight:800;color:#e6b84c;text-shadow:0 2px 6px #000}
.chat{position:absolute;right:8px;bottom:calc(150px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px}
.chat button{padding:5px 10px;font-size:.85rem;box-shadow:none;background:#ffffff26;color:#fff}
.bub{position:absolute;background:#fff;color:#111;padding:4px 12px;border-radius:14px;font-weight:800;display:none;z-index:5}
.ov{position:absolute;inset:0;background:#000a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:6;text-align:center;padding:20px}
#tst{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:8px 18px;border-radius:10px;font-weight:800;opacity:0;transition:.2s;z-index:20;pointer-events:none}
#tst.on{opacity:1}
.hand{bottom:calc(64px + env(safe-area-inset-bottom))}
.bid{bottom:calc(185px + env(safe-area-inset-bottom))}
.me{bottom:calc(172px + env(safe-area-inset-bottom))}
.chat{left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom));flex-direction:row;justify-content:center;gap:5px}
.chat button{padding:7px 11px}
#set{position:fixed;inset:0;z-index:30;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#set.on{display:flex}#set label{display:flex;flex-direction:column;gap:6px;font-weight:800;width:min(300px,80vw)}
#set input{width:100%;padding:0;border:0;background:none}
.cdn{color:#e6b84c;font-weight:800;margin-inline-start:4px}
</style></head><body>
<div class="scr on" id="login"><h1>♠ بلوت ♥</h1><div>العب مع ربعك من أي مكان</div>
<input id="nm" maxlength="12" placeholder="اسمك"><div class="avs" id="avs"></div><button id="go">ادخل</button></div>
<div class="scr" id="home"><h1>بلوت</h1><div id="hi"></div>
<div class="row"><div class="card"><b id="s1">0</b>لعبات</div><div class="card"><b id="s2">0</b>فوز</div><div class="card"><b id="s3">0%</b>نسبة الفوز</div><div class="card"><b id="s4">...</b>🪙 عملاتك</div></div>
<button id="qk">⚡ لعب سريع (100 🪙)</button><button id="mk">🎴 غرفة خاصة (500 🪙)</button>
<div class="row"><input id="cd" inputmode="numeric" maxlength="4" placeholder="كود الغرفة"><button id="jn">ادخل الغرفة</button></div>
<div class="row"><button class="g" id="ch">تغيير الاسم</button><button class="g" id="sg2">⚙️ الإعدادات</button></div></div>
<div class="scr" id="room"><h2>غرفتك</h2><div class="code" id="rc"></div>
<button id="sh">📤 شارك الرابط</button><div class="seats" id="st"></div>
<div class="row" id="hb"></div><button class="g" id="lv">خروج</button></div>
<div class="scr" id="game" style="padding:0"><div id="tb"></div><div id="bubs"></div></div>
<div id="set"><h2>⚙️ الإعدادات</h2><label>🎵 الموسيقى<input type="range" id="mv" min="0" max="1" step=".05"></label><label>🔊 المؤثرات<input type="range" id="sv" min="0" max="1" step=".05"></label><button id="sx">تم</button></div>
<div id="tst"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const so=io(),$=s=>document.querySelector(s),SY={S:'♠',H:'♥',D:'♦',C:'♣'};
const AV=['🦅','🐪','🦁','🐎','🦊','🐺','👑','🎩','🕌','🌴','⭐','🔥'];
let me={name:localStorage.n||'',av:localStorage.a||AV[0],tk:localStorage.tk||(localStorage.tk=Math.random().toString(36).slice(2)+Date.now().toString(36))},st=null,counted='';
const stats=()=>JSON.parse(localStorage.s||'{"p":0,"w":0}');
const show=id=>document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id));
function toast(m){const t=$('#tst');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)}
function avs(){$('#avs').innerHTML=AV.map(a=>`<span class="${a==me.av?'sel':''}">${a}</span>`).join('');
 document.querySelectorAll('#avs span').forEach(e=>e.onclick=()=>{me.av=e.textContent;avs()})}
avs();$('#nm').value=me.name;
function home(){const s=stats();$('#hi').textContent=me.av+' هلا '+me.name;$('#s1').textContent=s.p;$('#s2').textContent=s.w;$('#s3').textContent=(s.p?Math.round(s.w/s.p*100):0)+'%';show('home')}
$('#go').onclick=()=>{const n=$('#nm').value.trim();if(!n)return toast('اكتب اسمك');me.name=n;localStorage.n=n;localStorage.a=me.av;
 const q=new URLSearchParams(location.search).get('room');if(q){so.emit('join',{...me,code:q});history.replaceState({},'','/')}else home()};
$('#ch').onclick=()=>show('login');
$('#mk').onclick=()=>so.emit('create',me);
$('#jn').onclick=()=>so.emit('join',{...me,code:$('#cd').value.trim()});
$('#lv').onclick=()=>{so.emit('leave');st=null;home()};
$('#sh').onclick=()=>{const u=location.origin+'/?room='+st.code,t='تعال نلعب بلوت! كود الغرفة: '+st.code+'\n'+u;
 if(navigator.share)navigator.share({text:t}).catch(()=>{});else navigator.clipboard.writeText(t).then(()=>toast('تم نسخ الرابط ✅'))};
so.on('err',toast);
so.on('st',s=>{st=s;s.phase=='lobby'?lobby():table()});
function lobby(){show('room');$('#rc').textContent=st.code;
 $('#st').innerHTML=st.seats.map((p,i)=>p?`<div class="seat"><div class="e">${p.av}</div>${p.name}${i==st.host?' 👑':''}</div>`:'<div class="seat empty"><div class="e">➕</div>ينتظر لاعب</div>').join('');
 $('#hb').innerHTML=st.you==st.host?'<button id="bt" class="g">🤖 أضف بوتات</button><button id="gs">▶ ابدأ</button>':'<div>ننتظر المضيف يبدأ...</div>';
 if($('#bt')){$('#bt').onclick=()=>so.emit('bots');$('#gs').onclick=()=>so.emit('start')}}
const cardH=(c,x='')=>{const r=c.slice(0,-1),s=c.slice(-1);return`<div class="c ${s=='H'||s=='D'?'r':''} ${x}" data-c="${c}">${r}<i>${SY[s]}</i></div>`};
function table(){show('game');const s=st,m=s.you,mt=m%2,rel=r=>(m+r)%4;
 const md=s.phase=='bid'?'مزايدة':s.mode=='sun'?'صن':'حكم '+(SY[s.trump]||'');
 let h=`<div class="top"><span>نحن <b>${s.total[mt]}</b></span><span>${md}</span><span>هم <b>${s.total[1-mt]}</b></span></div>`;
 [1,2,3].forEach(r=>{const i=rel(r),p=s.seats[i];h+=`<div class="pl p${r} ${s.turn==i&&s.phase!='score'?'act':''}"><div class="av">${p.av}</div>${p.name}<div class="c bk mini"></div><em>${p.n}</em>${tcd(i)}</div>`});
 h+='<div class="mid">';
 if(s.floor)h+=`<div class="sl" style="inset:0;margin:auto;width:fit-content;height:fit-content">${cardH(s.floor)}</div>`;
 s.trick.forEach(t=>h+=`<div class="sl s${(t.seat-m+4)%4}">${cardH(t.card)}</div>`);
 h+='</div>';
 if(s.phase=='bid'&&s.turn==m)h+='<div class="bid"><button data-b="sun">صن</button><button data-b="hakm">حكم '+SY[s.floor.slice(-1)]+'</button><button class="g" data-b="pass">بس</button></div>';
 if(s.turn==m&&(s.phase=='play'||s.phase=='bid')&&!(s.phase=='play'&&!s.legal.length))h+='<div class="me">دورك 🎯 '+tcd(m)+'</div>';
 h+='<div class="chat"><button id="mc">'+(micOn?'🎙️':'🔇')+'</button><button id="sg">⚙️</button><button id="lb">🚪</button>'+['👏','يا سلام','عليك','بسرعة'].map(t=>`<button data-s="${t}">${t}</button>`).join('')+'</div>';
 h+='<div class="hand">'+s.hand.map(c=>cardH(c,s.legal.includes(c)?'ok':s.legal.length?'no':'')).join('')+'</div>';
 if(s.phase=='score'&&s.last){const l=s.last;h+=`<div class="ov"><h2>${l.ok?'نجح المشتري ✅':'سقط المشتري ❌'}</h2><div>نحن ${l.gp[mt]} — هم ${l.gp[1-mt]}</div><div>الجولة الجاية بعد لحظات...</div></div>`}
 if(s.phase=='over'){const w=s.total[mt]>s.total[1-mt];
  if(counted!=s.code+s.total){counted=s.code+s.total;const x=stats();x.p++;if(w)x.w++;localStorage.s=JSON.stringify(x)}
  h+=`<div class="ov"><h1>${w?'🏆 فزتوا!':'😅 خسرتوا'}</h1><div>نحن ${s.total[mt]} — هم ${s.total[1-mt]}</div>${w&&s.prize?'<div>🪙 ربحت +'+s.prize+'</div>':''}${s.you==s.host?'<button id="ag">جولة جديدة ('+s.fee+' 🪙)</button>':''}<button class="g" id="ex">خروج</button></div>`}
 $('#tb').innerHTML=h;
 $('#tb').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>so.emit('bid',b.dataset.b));
 $('#tb').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>so.emit('say',b.dataset.s));
 $('#tb').querySelectorAll('.hand .c.ok').forEach(c=>c.onclick=()=>so.emit('play',c.dataset.c));
 if($('#ag'))$('#ag').onclick=()=>so.emit('again');
 $('#mc').onclick=toggleMic;$('#lb').onclick=()=>{if(st.phase=='over'||confirm('لو خرجت الحين تخسر رسوم الدخول ('+st.fee+' 🪙) وما ترجع لك، ويكمّل مكانك بوت. تبي تخرج؟'))$('#lv').click()};$('#sg').onclick=()=>$('#set').classList.add('on');ensure();sounds();
 if($('#ex'))$('#ex').onclick=()=>$('#lv').click()}
const POS=['bottom:150px;left:50%','top:130px;right:70px','top:110px;left:50%','top:130px;left:70px'];
so.on('say',({seat,t})=>{if(!st)return;const r=(seat-st.you+4)%4,b=document.createElement('div');b.className='bub';b.style.cssText=POS[r]+';display:block';b.textContent=t;
 $('#bubs').appendChild(b);setTimeout(()=>b.remove(),2200)});
const q=new URLSearchParams(location.search).get('room');if(q)$('#cd').value=q;
if(me.name&&q){$('#go').click()}else if(me.name)home();

/* ===== الصوت ===== */
const V={m:+(localStorage.mv??.35),s:+(localStorage.sv??.8)};
let ac,mg,sg;
function vol(){if(ac){mg.gain.value=V.m*.5;sg.gain.value=V.s}}
function initA(){if(ac){if(ac.state=='suspended')ac.resume();return}
 ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();sg=ac.createGain();mg.connect(ac.destination);sg.connect(ac.destination);vol();bar();setInterval(bar,2400)}
function tn(f,t,d,ty,g,o){const x=ac.createOscillator(),y=ac.createGain();x.type=ty;x.frequency.value=f;
 y.gain.setValueAtTime(.0001,t);y.gain.linearRampToValueAtTime(g,t+.02);y.gain.exponentialRampToValueAtTime(.0001,t+d);
 x.connect(y);y.connect(o);x.start(t);x.stop(t+d+.05)}
const SC=[293.66,311.13,369.99,392,440,466.16,523.25,587.33];
function bar(){if(!ac||ac.state!='running')return;const t=ac.currentTime+.05;tn(146.83,t,2.4,'sine',.5,mg);
 for(let k=0;k<8;k++)tn(SC[Math.floor(Math.random()*8)],t+k*.3,.5,'triangle',.25,mg)}
function sfx(n){if(!ac||ac.state!='running')return;const t=ac.currentTime;
 if(n=='card'){tn(420,t,.08,'square',.25,sg);tn(180,t,.1,'triangle',.4,sg)}
 else if(n=='deal'){for(let k=0;k<5;k++)tn(300+k*40,t+k*.07,.06,'square',.15,sg)}
 else if(n=='turn'){tn(660,t,.15,'sine',.4,sg);tn(880,t+.12,.2,'sine',.4,sg)}
 else if(n=='win'){[523,659,784,1047].forEach((f,k)=>tn(f,t+k*.15,.4,'triangle',.4,sg))}
 else if(n=='lose'){[392,330,262].forEach((f,k)=>tn(f,t+k*.2,.4,'sawtooth',.2,sg))}
 else tn(500,t,.06,'sine',.3,sg)}
document.addEventListener('pointerdown',initA);
document.addEventListener('click',e=>{if(e.target.closest('button'))sfx('x')});
const mv=$('#mv'),sv=$('#sv');mv.value=V.m;sv.value=V.s;
mv.oninput=()=>{V.m=+mv.value;localStorage.mv=V.m;vol()};sv.oninput=()=>{V.s=+sv.value;localStorage.sv=V.s;vol()};
$('#sx').onclick=()=>$('#set').classList.remove('on');$('#sg2').onclick=()=>$('#set').classList.add('on');
$('#qk').onclick=()=>so.emit('quick',me);
/* ===== المؤقت والأصوات حسب الحالة ===== */
let pv={t:0,h:0,tu:-1,ph:''},dlAt=0;
const tcd=i=>st.turn==i&&(st.phase=='bid'||st.phase=='play')&&st.trick.length<4?'<b class="cdn"></b>':'';
function sounds(){const s=st;dlAt=Date.now()+s.left;
 if(s.trick.length>pv.t)sfx('card');if(s.hand.length>pv.h)sfx('deal');
 if(s.turn==s.you&&(pv.tu!=s.turn||pv.ph!=s.phase)&&(s.phase=='play'||s.phase=='bid'))sfx('turn');
 if(s.phase=='over'&&pv.ph!='over')sfx(s.total[s.you%2]>s.total[1-s.you%2]?'win':'lose');
 pv={t:s.trick.length,h:s.hand.length,tu:s.turn,ph:s.phase}}
setInterval(()=>{const n=Math.max(0,Math.ceil((dlAt-Date.now())/1000));document.querySelectorAll('.cdn').forEach(e=>e.textContent=n)},250);
/* ===== المايك (WebRTC) ===== */
const pcs={};let mic=null,micOn=false;
function attach(pc){const t=pc.getTransceivers()[0];if(t&&mic)t.sender.replaceTrack(mic.getAudioTracks()[0])}
function peer(j,off){if(pcs[j])return pcs[j];
 const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 if(off)pc.addTransceiver('audio',{direction:'sendrecv'});
 pc.onicecandidate=e=>e.candidate&&so.emit('rtc',{to:j,data:{c:e.candidate}});
 pc.ontrack=e=>{let a=document.getElementById('au'+j);if(!a){a=document.createElement('audio');a.id='au'+j;a.autoplay=true;document.body.appendChild(a)}a.srcObject=e.streams[0]||new MediaStream([e.track]);a.play().catch(()=>{})};
 return pcs[j]=pc}
async function call(j){const pc=peer(j,1);if(mic)attach(pc);const o=await pc.createOffer();await pc.setLocalDescription(o);so.emit('rtc',{to:j,data:{d:pc.localDescription}})}
so.on('rtc',({from,data})=>{const pc=peer(from,0);pc.q=(pc.q||Promise.resolve()).then(async()=>{try{
 if(data.d){await pc.setRemoteDescription(data.d);
  if(data.d.type=='offer'){pc.getTransceivers().forEach(t=>t.direction='sendrecv');if(mic)attach(pc);const a=await pc.createAnswer();await pc.setLocalDescription(a);so.emit('rtc',{to:from,data:{d:pc.localDescription}})}}
 else if(data.c)await pc.addIceCandidate(data.c)}catch(e){}})});
function ensure(){st.seats.forEach((p,j)=>{if(j==st.you)return;
 if(!p||p.bot){if(pcs[j]){pcs[j].close();delete pcs[j]}return}
 if(j>st.you&&!pcs[j])call(j)})}
async function toggleMic(){
 if(!mic){try{mic=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast('لازم تسمح للمايك من المتصفح')}
  Object.values(pcs).forEach(attach);micOn=true;toast('المايك شغال 🎙️')}
 else{micOn=!micOn;mic.getAudioTracks()[0].enabled=micOn;toast(micOn?'المايك شغال 🎙️':'المايك مقفل 🔇')}
 const b=$('#mc');if(b)b.textContent=micOn?'🎙️':'🔇'}
$('#lv').addEventListener('click',()=>{Object.values(pcs).forEach(p=>p.close());for(const k in pcs)delete pcs[k];document.querySelectorAll('audio').forEach(a=>a.remove())});
so.on('coins',c=>{const e=$('#s4');if(e)e.textContent=c});
so.on('connect',()=>so.emit('hi',me.tk));
</script></body></html>
